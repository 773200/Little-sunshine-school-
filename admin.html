<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Sunshine Admin</title><link rel="stylesheet" href="/admin.css"></head><body><div id="login" class="login"><img src="/logo.png"><h1>Admin Login</h1><p>Little Sunshine Play School</p><form id="loginForm"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Log In</button><div id="loginError"></div></form><a href="/">← Back to website</a></div><div id="panel" class="hidden"><header><div><img src="/logo.png"><b>Little Sunshine Admin</b></div><button id="logout">Logout</button></header><main><h1>Website Manager ☀️</h1><p>Update your website. Save your changes, then publish.</p><div class="tabs"><button data-tab="content" class="active">Content</button><button data-tab="gallery">Gallery</button><button data-tab="videos">Videos</button><button data-tab="programs">Programs</button></div><section id="contentTab"><label>Tagline<input id="tagline"></label><label>About the school<textarea id="about"></textarea></label><label>Phone<input id="phone"></label><label>Address<textarea id="address"></textarea></label><h2>Admission announcement</h2><label>Title<input id="annTitle"></label><label>Text<textarea id="annText"></textarea></label></section><section id="galleryTab" class="hidden"><h2>Photo Gallery</h2><p>Upload JPG, PNG, GIF or WebP images (up to 12 MB each).</p><input type="file" id="photo" accept="image/*" multiple><button id="upload">Upload photos</button><div id="galleryList" class="items"></div></section><section id="videosTab" class="hidden"><h2>Video Gallery</h2><div class="row"><input id="videoTitle" placeholder="Video title"><input id="videoUrl" placeholder="YouTube or video URL"></div><textarea id="videoDesc" placeholder="Description"></textarea><button id="addVideo">Add video</button><div id="videoList" class="items"></div></section><section id="programsTab" class="hidden"><h2>Programs</h2><div id="programList"></div><button id="addProgram">+ Add Program</button><h2>Facilities</h2><div id="facilityList"></div><button id="addFacility">+ Add Facility</button></section><div class="actions"><button id="save" class="secondary">Save Draft</button><button id="publish">Publish Website</button><span id="status"></span></div></main></div><script src="/admin.js"></script></body></html>
